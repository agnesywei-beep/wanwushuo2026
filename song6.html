<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>夜間的星辰</title>
    <style>
        body {
            background-color: #000000;  /* Black background */
            color: #ffffff;
            font-family: sans-serif;
            font-size: 64px;
            line-height: 1.8;
            text-align: left;           /* Left-align lyrics text */
            max-width: 900px;           /* Keeps text container centered on projection */
            margin: 0 auto;
            padding: 40px 20px;
            margin-bottom: 80vh;
        }
        .controls { 
            position: fixed; 
            top: 20px; 
            right: 20px; 
            z-index: 1000; 
        }
        button {
            font-size: 14px; 
            padding: 6px 14px; 
            cursor: pointer;
            background-color: #333333; 
            color: #ffffff;
            border: 1px solid #666666; 
            border-radius: 4px; 
            opacity: 0.7;
        }
        button:hover { 
            background-color: #555555; 
            opacity: 1.0; 
        }
        .title { 
            color: #ffcc00;            /* Yellow song title */
            font-weight: bold;
            font-size: 72px;
        }
        .section-tag {
            color: #aaaaaa;
            font-size: 40px;
            margin-top: 30px;
        }
        .back-btn {
            display: inline-block; 
            font-size: 24px; 
            color: #888888;
            text-decoration: none; 
            margin-top: 50px;
            border: 1px solid #444444; 
            padding: 8px 20px; 
            border-radius: 4px;
        }
        .back-btn:hover { 
            color: #ffffff; 
            border-color: #888888; 
        }
    </style>
</head>
<body>

    <div class="controls">
        <button id="scrollBtn" onclick="toggleScroll()">></button>
    </div>

    <p>
        <span class="title"> 夜間的星辰</span><br><br>


詞｜高征財神父	<br>
曲｜連監堯<br>
<br>
夜晚，<br>
天主的女兒，<br>
月亮的光輝，<br>
在睡眠時給我的光榮，<br>
如同太陽在白天給予的。<br>
黑暗中微光閃爍的姊妹，<br>
我向你致敬。<br>

夜晚，<br>
黑眼珠光輝，<br>
月亮與星辰，<br>
在夜間時給我的光明，<br>
如同海洋是水的儲藏地。<br>
黑暗中生命靠妳的指引，<br>
我向你開放。<br>

<br>
生活中的忽明忽暗，<br>
使我看見人們內心的貧窮。<br>
有如馬槽般一無所有。<br>
黑暗中的星辰，<br>
使我看見天主的光明。<br>
充滿天主貧窮中富欲的愛。<br>

<br>
    </p>

    <div style="text-align: center;">
        <a href="index.html" class="back-btn">← 返回目錄</a>
    </div>

    <script>
        let scrollInterval = null, isScrolling = false, scrollSpeed = 1;
        function toggleScroll() {
            const btn = document.getElementById('scrollBtn');
            if (isScrolling) {
                clearInterval(scrollInterval); 
                btn.innerText = ">"; 
                isScrolling = false;
            } else {
                scrollInterval = setInterval(() => { window.scrollBy(0, scrollSpeed); }, 30);
                btn.innerText = "||"; 
                isScrolling = true;
            }
        }
    </script>
</body>
</html>
