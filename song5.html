<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>太陽弟兄</title>
    <style>
        body {
            background-color: #000000;  /* Black background */
            color: #ffffff;
            font-family: sans-serif;
            font-size: 64px;
            line-height: 1.8;
            text-align: left;           /* Left-align lyrics text */
            max-width: 900px;           /* Keeps text container centered on projection */
            margin: 0 auto;
            padding: 40px 20px;
            margin-bottom: 80vh;
        }
        .controls { 
            position: fixed; 
            top: 20px; 
            right: 20px; 
            z-index: 1000; 
        }
        button {
            font-size: 14px; 
            padding: 6px 14px; 
            cursor: pointer;
            background-color: #333333; 
            color: #ffffff;
            border: 1px solid #666666; 
            border-radius: 4px; 
            opacity: 0.7;
        }
        button:hover { 
            background-color: #555555; 
            opacity: 1.0; 
        }
        .title { 
            color: #ffcc00;            /* Yellow song title */
            font-weight: bold;
            font-size: 72px;
        }
        .section-tag {
            color: #aaaaaa;
            font-size: 40px;
            margin-top: 30px;
        }
        .back-btn {
            display: inline-block; 
            font-size: 24px; 
            color: #888888;
            text-decoration: none; 
            margin-top: 50px;
            border: 1px solid #444444; 
            padding: 8px 20px; 
            border-radius: 4px;
        }
        .back-btn:hover { 
            color: #ffffff; 
            border-color: #888888; 
        }
    </style>
</head>
<body>

    <div class="controls">
        <button id="scrollBtn" onclick="toggleScroll()">></button>
    </div>

    <p>
        <span class="title"> 太陽弟兄</span><br><br>

       

詞｜高征財神父	<br>
曲｜連監堯<br>
<br>
我生來是為了看見，<br>
也是為了獲得生活。<br>
我雙眼看見了太陽，<br>
喜樂凝視這個宇宙。<br>
啊！有福的雙眼，<br>
藉著太陽弟兄的光明，<br>
我看出多麼美好的美景，<br>
心中喜悅。<br>
<br>
我心靈原就是為主，<br>
也願擁有天父愛情。<br>
我雙眼不能直視祂，<br>
喜樂下到這個宇宙。<br>
啊！謙卑的靈魂，<br>
藉著太陽弟兄的溫暖，<br>
我體會天父雙臂的環抱，<br>
心中喜悅。<br>
<br>
心中有太陽的人，<br>
懷中就有宇宙的善良，<br>
就像天父無私的愛，<br>
慈愛接納大地萬物。<br>
心中有太陽的人，<br>
懷中就有宇宙的善良，<br>
就像美好的太陽，<br>
成為生命果實的泉源。<br>

<br>
    </p>

    <div style="text-align: center;">
        <a href="index.html" class="back-btn">← 返回目錄</a>
    </div>

    <script>
        let scrollInterval = null, isScrolling = false, scrollSpeed = 1;
        function toggleScroll() {
            const btn = document.getElementById('scrollBtn');
            if (isScrolling) {
                clearInterval(scrollInterval); 
                btn.innerText = ">"; 
                isScrolling = false;
            } else {
                scrollInterval = setInterval(() => { window.scrollBy(0, scrollSpeed); }, 30);
                btn.innerText = "||"; 
                isScrolling = true;
            }
        }
    </script>
</body>
</html>
