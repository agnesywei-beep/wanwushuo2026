<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>被救贖的人</title>
    <style>
        body {
            background-color: #000000;  /* Black background */
            color: #ffffff;
            font-family: sans-serif;
            font-size: 64px;
            line-height: 1.8;
            text-align: left;           /* Left-align lyrics text */
            max-width: 900px;           /* Keeps text container centered on projection */
            margin: 0 auto;
            padding: 40px 20px;
            margin-bottom: 80vh;
        }
        .controls { 
            position: fixed; 
            top: 20px; 
            right: 20px; 
            z-index: 1000; 
        }
        button {
            font-size: 14px; 
            padding: 6px 14px; 
            cursor: pointer;
            background-color: #333333; 
            color: #ffffff;
            border: 1px solid #666666; 
            border-radius: 4px; 
            opacity: 0.7;
        }
        button:hover { 
            background-color: #555555; 
            opacity: 1.0; 
        }
        .title { 
            color: #ffcc00;            /* Yellow song title */
            font-weight: bold;
            font-size: 72px;
        }
        .section-tag {
            color: #aaaaaa;
            font-size: 40px;
            margin-top: 30px;
        }
        .back-btn {
            display: inline-block; 
            font-size: 24px; 
            color: #888888;
            text-decoration: none; 
            margin-top: 50px;
            border: 1px solid #444444; 
            padding: 8px 20px; 
            border-radius: 4px;
        }
        .back-btn:hover { 
            color: #ffffff; 
            border-color: #888888; 
        }
    </style>
</head>
<body>

    <div class="controls">
        <button id="scrollBtn" onclick="toggleScroll()">></button>
    </div>

    <p>
        <span class="title"> 被救贖的人</span><br><br>

    </p>

    <div style="text-align: center;">
        <a href="index.html" class="back-btn">← 返回目錄</a>
    </div>

    <script>
        let scrollInterval = null, isScrolling = false, scrollSpeed = 1;
        function toggleScroll() {
            const btn = document.getElementById('scrollBtn');
            if (isScrolling) {
                clearInterval(scrollInterval); 
                btn.innerText = ">"; 
                isScrolling = false;
            } else {
                scrollInterval = setInterval(() => { window.scrollBy(0, scrollSpeed); }, 30);
                btn.innerText = "||"; 
                isScrolling = true;
            }
        }
    </script>
</body>
</html>
